# A container cannot suspend (writing /sys/power/state fails with EROFS). Report sleep as unsupported so Steam's
# idle-suspend has nothing to call; previously it put the display to sleep, the suspend failed, and the panel stayed off.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
