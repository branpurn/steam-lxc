# Arch LXC containers drop CAP_SETFCAP (archlinux.common.conf), so systemd cannot set up PrivateUsers=yes:
# "Failed to set up user namespacing: Operation not permitted" (status=217/USER), and every D-Bus activation
# (powerdevil) hits start-limit-hit. Run upower without the private user namespace; the rest of its sandbox stays.
[Service]
PrivateUsers=no
