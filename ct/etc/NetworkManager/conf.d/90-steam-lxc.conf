# NetworkManager only manages the Frame dongle (wlframe0); eth0 stays with systemd-networkd.
[keyfile]
unmanaged-devices=except:interface-name:wlframe0

[device-wlframe0]
match-device=interface-name:wlframe0
wifi.scan-rand-mac-address=no

[connection-wlframe0]
match-device=interface-name:wlframe0
wifi.cloned-mac-address=permanent
