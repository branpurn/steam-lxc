# Frame shim: NetworkManager manages only the Steam Frame Wireless Adapter (default interface wlframe0);
# everything else (eth0) stays with systemd-networkd. Installed when FRAME_SHIM_DONGLE_NM=1.
[keyfile]
unmanaged-devices=except:interface-name:wlframe0

[device-wlframe0]
match-device=interface-name:wlframe0
wifi.scan-rand-mac-address=no

[connection-wlframe0]
match-device=interface-name:wlframe0
wifi.cloned-mac-address=permanent
