# Host /etc/modprobe.d/: use the out-of-tree rtw89 (*_git modules, see build-rtw89-git.sh) for the Frame adapter.
# The in-kernel rtw89_8852cu fails to associate ("failed to insert STA entry for the AP (error -22)").
options rtw89_core_git disable_ps_mode=1
blacklist rtw89_8852cu
blacklist rtw89_8852c
blacklist rtw89_usb
blacklist rtw89_core
# blacklist does not stop explicit/alias loads by modalias; this does
install rtw89_8852cu /bin/false
